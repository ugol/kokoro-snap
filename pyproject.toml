[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoro-snap-server"
version = "0.1.0"
description = "Local OpenAI-style TTS API adapter for Kokoro ONNX"
requires-python = ">=3.10,<3.14"
dependencies = ["kokoro-onnx==0.6.1", "numpy>=2,<3"]

[project.optional-dependencies]
italian = ["misaki-fork[en]"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
